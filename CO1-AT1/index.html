<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Welcome to My Website</title>
<style>
body {
background-color: lightblue;
font-family: Cambria, serif;
font-size: 14px;
text-align: center;
margin: 0;
padding: 20px;
}
h1 {
color: #003366;
}
/* Scrolling text using CSS animation */
.marquee {
width: 100%;
overflow: hidden;
white-space: nowrap;
box-sizing: border-box;
background-color: #cfe8fc;
border: 1px solid #3366cc;
padding: 8px 0;
margin: 15px 0;
}
.marquee span {
display: inline-block;
padding-left: 100%;
animation: scroll-left 12s linear infinite;
color: #003366;
}
@keyframes scroll-left {
0% { transform: translateX(0); }
100% { transform: translateX(-100%); }
}
/* Blue button with white text */
.btn {
background-color: #0059b3;
color: white;
font-family: Cambria, serif;
font-size: 14px;
padding: 10px 20px;
border: none;
border-radius: 5px;
cursor: pointer;
margin: 15px 0;
}
.btn:hover {
background-color: #003d80;
}
/* Grid box layout */
.grid-container {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 15px;
max-width: 600px;
margin: 20px auto;
}
.grid-box {
background-color: #3399ff;
color: white;
padding: 20px;
border-radius: 8px;
font-weight: bold;
}
</style>
</head>
<body>
<h1>Welcome to My Website</h1>
<div class="marquee">
<span>Welcome to my very first HTML and CSS page! Thanks for visiting.</span>
</div>
<button class="btn">Click Me</button>
<div class="grid-container">
<div class="grid-box">Box 1</div>
<div class="grid-box">Box 2</div>
<div class="grid-box">Box 3</div>
<div class="grid-box">Box 4</div>
<div class="grid-box">Box 5</div>
<div class="grid-box">Box 6</div>
</div>
</body>
</html>
